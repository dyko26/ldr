<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="nightSkyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#070B18" />
      <stop offset="55%" stop-color="#111936" />
      <stop offset="100%" stop-color="#1C274E" />
    </linearGradient>
    <radialGradient id="amberGlow" cx="50%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#F2D5A7" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#E6B979" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0B1021" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldArc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E6B979" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#F2D5A7" stop-opacity="1" />
      <stop offset="100%" stop-color="#E6B979" stop-opacity="0.35" />
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#nightSkyGrad)" />
  <circle cx="256" cy="200" r="210" fill="url(#amberGlow)" />

  <!-- Subtle Inner Gold Frame -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#E6B979" stroke-opacity="0.22" stroke-width="2.5" />

  <!-- Stars -->
  <g fill="#F5EFE6">
    <circle cx="96" cy="108" r="2.5" opacity="0.8" />
    <circle cx="148" cy="76" r="1.8" opacity="0.6" />
    <circle cx="386" cy="92" r="2.6" opacity="0.85" />
    <circle cx="422" cy="148" r="1.8" opacity="0.65" />
    <circle cx="78" cy="204" r="2.0" opacity="0.7" />
    <circle cx="332" cy="70" r="2.0" opacity="0.75" />
    <circle cx="206" cy="98" r="1.6" opacity="0.55" />
  </g>

  <!-- Four-Point Sparkle Stars -->
  <path d="M256 64 L260 78 L274 82 L260 86 L256 100 L252 86 L238 82 L252 78 Z" fill="#F2D5A7" />
  <path d="M126 142 L128.5 150 L136.5 152.5 L128.5 155 L126 163 L123.5 155 L115.5 152.5 L123.5 150 Z" fill="#E6B979" opacity="0.9" />
  <path d="M384 134 L386.5 142 L394.5 144.5 L386.5 147 L384 155 L381.5 147 L373.5 144.5 L381.5 142 Z" fill="#E6B979" opacity="0.9" />

  <!-- Warm Crescent Moon -->
  <path d="M276 118 A46 46 0 1 0 318 182 A36 36 0 1 1 276 118 Z" fill="#F2D5A7" />

  <!-- Glowing Constellation Arc Connecting Calgary (Left) and La Fortuna (Right) -->
  <path d="M 98 310 Q 256 155 414 310" fill="none" stroke="url(#goldArc)" stroke-width="4" stroke-dasharray="7 7" stroke-linecap="round" />
  <circle cx="98" cy="310" r="6" fill="#F2D5A7" />
  <circle cx="176" cy="248" r="4.5" fill="#E6B979" />
  <circle cx="256" cy="228" r="6.5" fill="#F2D5A7" />
  <circle cx="336" cy="248" r="4.5" fill="#E6B979" />
  <circle cx="414" cy="310" r="6" fill="#F2D5A7" />

  <!-- Left Horizon: Calgary Rocky Mountains & Pine Silhouettes -->
  <path d="M 20 420 L 72 332 L 112 378 L 154 318 L 214 405 L 256 420 Z" fill="#141F3E" stroke="#E6B979" stroke-opacity="0.28" stroke-width="1.5" />
  <!-- Snow Caps -->
  <path d="M 72 332 L 58 355 L 72 350 L 85 356 Z" fill="#F5EFE6" opacity="0.7" />
  <path d="M 154 318 L 138 344 L 154 338 L 169 346 Z" fill="#F5EFE6" opacity="0.75" />

  <!-- Right Horizon: La Fortuna Arenal Volcano & Tropical Canopy -->
  <path d="M 248 420 L 315 372 L 352 308 L 372 308 L 418 375 L 492 420 Z" fill="#101833" stroke="#E6B979" stroke-opacity="0.32" stroke-width="1.5" />
  <!-- Subtle Golden Crater Glow -->
  <circle cx="362" cy="306" r="5" fill="#D49A52" opacity="0.85" />

  <!-- Foreground Base Wave -->
  <path d="M 20 416 Q 140 392 256 414 T 492 412 L 492 492 L 20 492 Z" fill="#090D1B" />

  <!-- Monogram "D · P" -->
  <text x="256" y="458" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#E6B979" letter-spacing="6" opacity="0.9">D · P</text>
</svg>
